<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css')}}">
</head>
<body>
 <body>
    <form method="POST">
        <label for="navn">Navn:</label>
        <input type="text" id="navn" name="navn" required>

        <label for="produkt">Produkt:</label>
        <select id="produkt" name="produkt" required>
            {% for produkt in produkter %}
                <option value="{{ produkt }}">{{ produkt }}</option>
            {% endfor %}
        </select>

        <label for="storrelse">Størrelse:</label>
        <select id="storrelse" name="storrelse" required>
            {% for storrelse in storrelser %}
                <option value="{{ storrelse }}">{{ storrelse }}</option>
            {% endfor %}
        </select>

        <label for="antall">Antall:</label>
        <input type="number" id="antall" name="antall" min="1" required>

        <button type="submit">Send</button>
    </form>

    <div class="switch">
        <a href="{{ url_for('index') }}">Forside</a>
    </div>
</body>
</body>
</html>
